<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F4FA">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="على الخط">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="onesignal-config.js"></script>
<meta name="description" content="تمرين إنجليزي لمكالمات الكول سنتر والإنترفيو: كلمات، نطق، جرامر، ومكالمات تجريبية.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>On the Line</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&family=Amiri:wght@700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a bright agent console. Side rail with the line status on desktop, a dock at the bottom on phones, one working panel at a time. One light look on purpose */
:root{
  --bg:#F1F4FA; --bg-glow:#FFE6D3; --bg-glow-2:#D6EEF4; --surface:#FFFFFF; --raise:#F6F8FC; --sunk:#E8EDF5; --ink:#0E1A2F; --muted:#56647D; --line:#DCE3EE;
  --accent:#E2601A; --accent-2:#FF9A4D; --accent-ink:#FFFFFF; --accent-soft:#FFE8D7;
  --sig:#0B8AA3; --sig-soft:#D9F1F6;
  --good:#138556; --good-soft:#DAF3E7; --bad:#CC3146; --bad-soft:#FCE0E4;
  --live:var(--accent); --live-soft:var(--accent-soft);
  --shadow:0 1px 2px rgba(20,40,80,.05),0 14px 32px -22px rgba(20,40,80,.35);
  --f-display:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
body{background:radial-gradient(900px 480px at 100% -10%,var(--bg-glow),transparent 65%) no-repeat,radial-gradient(800px 420px at -10% 30%,var(--bg-glow-2),transparent 60%) no-repeat,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;min-height:100vh}
*{box-sizing:border-box}
.en{direction:ltr;unicode-bidi:isolate;text-align:left}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3;font-weight:600}
h2{font-size:1.55rem} h3{font-size:1.08rem}
p{margin:0}
a{color:var(--sig)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* shell */
#app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:232px minmax(0,1fr);gap:30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
.rail{position:sticky;top:22px;align-self:start;display:flex;flex-direction:column;gap:26px;min-height:calc(100vh - 44px)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--accent-ink);background:linear-gradient(140deg,var(--accent-2),var(--accent));box-shadow:0 8px 22px -8px var(--accent)}
.logo svg{width:22px;height:22px}
.brand h1{font-size:1.25rem;line-height:1.1}
.brand .tag{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{appearance:none;border:0;background:none;color:var(--muted);font:600 .95rem var(--f-body);display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer;text-align:start;position:relative}
.nav button svg{width:20px;height:20px;flex:0 0 20px}
.nav button:hover{color:var(--ink);background:var(--raise)}
.nav button[aria-current="page"]{color:var(--ink);background:linear-gradient(270deg,var(--accent-soft),transparent)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.count{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.count b{font-family:var(--f-mono);font-size:1.15rem;color:var(--accent)}
.onair{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;color:var(--accent);font-weight:600}
.onair i,.count .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.top{display:none}
#view{min-width:0}
footer{margin-top:26px;font-size:.8rem;color:var(--muted);text-align:center}

@media (max-width:899px){
  #app{grid-template-columns:minmax(0,1fr);gap:0;padding-block:14px calc(100px + env(safe-area-inset-bottom,0px))}
  .rail{display:contents}
  .rail .brand,.railfoot{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .top .brand h1{font-size:1.15rem}
  .top .logo{width:36px;height:36px;border-radius:11px}
  .top .count{padding:6px 12px}
  .nav{position:fixed;z-index:15;bottom:0;left:0;right:0;flex-direction:row;gap:0;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .nav button{flex:1;min-width:0;flex-direction:column;gap:2px;padding:7px 2px;font-size:.68rem;border-radius:10px;text-align:center}
  .nav button[aria-current="page"]{background:var(--accent-soft)}
  .nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
}

/* primitives */
.stack{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.grid2>*,.grid3>*{min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--raise);color:var(--ink);font:600 .92rem var(--f-body);padding:10px 18px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .12s,border-color .12s,filter .12s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(140deg,var(--accent-2),var(--accent));color:var(--accent-ink);border-color:transparent;box-shadow:0 10px 24px -12px var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 60%,transparent);background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ibtn{appearance:none;width:38px;height:38px;flex:0 0 38px;border-radius:50%;border:1px solid var(--line);background:var(--raise);color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;transition:transform .12s,color .12s,border-color .12s}
.ibtn:hover{border-color:var(--sig);color:var(--sig)}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:17px;height:17px}
.ibtn.rec,.btn.rec{background:var(--bad);border-color:var(--bad);color:var(--bg);animation:recp 1.2s infinite}
@keyframes recp{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 60%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.chip{appearance:none;border:1px solid var(--line);background:var(--raise);color:var(--ink);font:500 .85rem var(--f-body);padding:6px 13px;border-radius:999px;cursor:pointer;text-decoration:none}
.chip:hover{border-color:var(--sig)}
.chip[aria-pressed="true"]{background:var(--sig-soft);border-color:var(--sig);color:var(--ink)}
.pill{display:inline-block;font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.live{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.label{font-size:.74rem;font-weight:600;letter-spacing:.04em;color:var(--muted)}
textarea,input[type=text],input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:11px 13px;resize:vertical}
textarea:focus,input:focus{border-color:var(--sig)}
.nav button:focus-visible,.btn:focus-visible,.chip:focus-visible,.ibtn:focus-visible,.tile:focus-visible,.scen:focus-visible,textarea:focus-visible,input:focus-visible,.check:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.bar{height:7px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(270deg,var(--sig),color-mix(in srgb,var(--sig) 55%,var(--accent)));border-radius:99px;transition:width .5s}
.note{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:.9rem}
.note.warn{background:var(--accent-soft);border-color:transparent}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}

/* today: hero console */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding:26px 26px 54px;background:radial-gradient(520px 260px at 0% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),radial-gradient(460px 260px at 100% 100%,color-mix(in srgb,var(--sig) 16%,transparent),transparent 70%),var(--surface)}
.ring{position:relative;width:168px;height:168px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--sunk);stroke-width:10}
.ring .prg{fill:none;stroke:url(#rg);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-family:var(--f-mono);font-size:3rem;font-weight:600;line-height:1}
.ring-c span{font-size:.8rem;color:var(--muted)}
.hero-txt{display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.eyebrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.hero h2{font-size:1.75rem}
.meter{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;max-width:460px}
.wave{position:absolute;inset:auto 0 0 0;height:44px;display:flex;align-items:flex-end;gap:3px;padding-inline:20px;opacity:.5;pointer-events:none}
.wave i{flex:1;min-width:2px;border-radius:2px 2px 0 0;background:linear-gradient(0deg,color-mix(in srgb,var(--sig) 50%,transparent),var(--sig));transform-origin:bottom;animation:wv 1.6s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@media (max-width:600px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center;padding:22px 18px 52px}.hero-txt{align-items:center}.eyebrow{justify-content:center}.meter{width:100%}.ring{width:150px;height:150px}.hero h2{font-size:1.45rem}}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{appearance:none;font:inherit;color:inherit;text-align:start;cursor:pointer;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--raise);transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--sig)}
.tile .t{font-weight:600}
.mini{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--sig) calc(var(--p)*1%),var(--sunk) 0);position:relative}
.mini::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--raise)}
.mini svg,.mini b{position:relative;width:20px;height:20px;color:var(--muted)}
.mini b{width:auto;height:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--ink)}
.tile.done{border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.tile.done .mini{background:var(--good)}
.tile.done .mini::before{background:var(--good)}
.tile.done .mini svg{color:var(--good-soft)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:var(--raise);cursor:pointer;padding:0;color:var(--accent-ink)}
.check.on{background:var(--good);border-color:var(--good);color:var(--good-soft)}
.check svg{width:14px;height:14px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:.68rem;color:var(--muted);text-align:center}
.cal .c{aspect-ratio:1;max-width:100%;border-radius:9px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.cal .c.today{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink);font-weight:600}
.cal .c.d{background:linear-gradient(140deg,var(--accent-2),var(--accent));color:var(--accent-ink);font-weight:700}
.phase{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.phase:first-of-type{border-top:0}
.phase.now .pw{color:var(--accent);font-weight:700}
.phase.now b{color:var(--ink)}
.phase.past{opacity:.55}
.pw{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}

/* cards */
.card{position:relative;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--sig) 9%,var(--surface)),var(--surface) 45%);border:1px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:16px;min-height:280px;box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(270deg,var(--sig),var(--accent))}
.card .prompt{font-family:var(--f-display);font-size:1.6rem;font-weight:600;line-height:1.35}
.card .answer{font-size:1.55rem;font-weight:700;color:var(--sig);animation:rise .35s ease-out}
.card .ex{background:var(--sunk);border-radius:12px;padding:11px 14px;animation:rise .45s ease-out}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rate .btn[data-r="0"]{color:var(--bad)}
.rate .btn[data-r="1"]{color:var(--accent)}
.heard{font-size:.9rem;padding:10px 14px;border-radius:12px;animation:rise .3s ease-out}
.heard.good{background:var(--good-soft);color:var(--good)}
.heard.bad{background:var(--bad-soft);color:var(--bad)}
.list-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.composer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:end}

/* sounds */
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.pair:first-child{border-top:0}
.pair .vs{font-size:.72rem;color:var(--muted)}
.wd{display:flex;align-items:center;gap:6px;justify-content:flex-start;min-width:0;flex-wrap:wrap}
.wd .w{font-weight:600;font-size:1.05rem;direction:ltr}
.wd .r{font-size:.74rem}
.mouth{border-inline-start:4px solid var(--accent);padding:12px 16px;background:var(--accent-soft);border-radius:12px}

/* call */
.callbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(120deg,var(--raise),var(--sunk));border:1px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow)}
.callbar .who{font-weight:600}
.callbar .livep{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--accent);font-weight:600}
.callbar .livep i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
.callbar #ctimer{font-size:1.1rem;color:var(--sig)}
.tx{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:4px}
.bub{max-width:85%;padding:11px 15px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .25s ease-out}
.bub.me{align-self:flex-end;background:var(--sig-soft);border-end-end-radius:5px}
.bub.them{align-self:flex-start;background:var(--raise);border:1px solid var(--line);border-end-start-radius:5px}
.bub .who{display:block;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;font-weight:600;color:var(--muted);margin-bottom:2px}
.scen{display:flex;flex-direction:column;gap:8px;text-align:start;cursor:pointer;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.scen:hover{transform:translateY(-2px);border-color:var(--sig)}
.scen.star{border-color:color-mix(in srgb,var(--accent) 60%,transparent);background:radial-gradient(360px 160px at 100% 0%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 70%),var(--surface)}
.score{font-family:var(--f-mono);font-size:3rem;font-weight:600;line-height:1;background:linear-gradient(140deg,var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.mis{padding:11px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.mis:first-child{border-top:0}
.said{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.better{color:var(--good);font-weight:600}

/* setup */
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:st}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;counter-increment:st}
.steps li::before{content:counter(st);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;background:var(--sig-soft);color:var(--sig)}
.kbd{font-family:var(--f-mono);font-size:.85rem;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.keyrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--f-mono);font-size:1.8rem;line-height:1.2}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow);animation:rise .25s ease-out}
@media (max-width:899px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
/* level ladder: A2 → B2+, where you are and where you're heading */
.ladder{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;direction:ltr}
.rung{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:26px}
.rung .bar2{width:100%;height:10px;border-radius:99px;background:var(--sunk)}
.rung.on .bar2{background:linear-gradient(90deg,var(--sig),color-mix(in srgb,var(--sig) 60%,var(--accent)))}
.rung.goal .bar2{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 6px,color-mix(in srgb,var(--accent) 35%,var(--accent-soft)) 6px 12px)}
.rung b{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.rung.now b,.rung.target b{color:var(--ink)}
.rung .flag{position:absolute;top:0;font-size:.68rem;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap;direction:rtl}
.rung.now .flag{background:var(--sig);color:#fff}

function tasks(k){const d=S.days[k||today()];let ts=sample?TASKS:TASKS.filter(t=>t.id!=="calls"&&t.id!=="use");
  if(d&&d.lazy)return ts.filter(t=>LAZY[t.id]).map(t=>Object.assign({},t,LAZY[t.id]));
  // "في الفورمة": the chosen area gets double the goal and goes first
  if(d&&d.form&&ts.some(t=>t.id===d.form)){ts=ts.map(t=>t.id===d.form?Object.assign({},t,{goal:(t.goal||1)*2,min:t.min*2,d:FORM_D[t.id]||t.d,boost:true}):t);ts.sort((a,b)=>(b.boost?1:0)-(a.boost?1:0))}

function toContents(input){
  const arr=typeof input==="string"?[{role:"user",content:input}]:input,out=[];
  arr.forEach(m=>{const role=m.role==="assistant"?"model":"user",last=out[out.length-1];
    const parts=m.parts?m.parts:[{text:String(m.content)}],lp=last&&last.parts[last.parts.length-1];
    if(last&&last.role===role){if(!m.parts&&lp&&lp.text!=null)lp.text+="\n\n"+m.content;else last.parts.push(...parts)}else out.push({role,parts:parts.slice()})});
  return out;
}
// one request with its own 40-second limit, so a stuck connection ends with a clear message instead of loading forever
async function gFetch(m,key,body,signal,ms){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms||40000);
  const onAbort=()=>ctl.abort();if(signal)signal.addEventListener("abort",onAbort);
  try{
    const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent",{method:"POST",signal:ctl.signal,
      headers:{"Content-Type":"application/json","x-goog-api-key":key},body});
    const txt=await res.text();return {res,txt};
  }catch(e){
    if(signal&&signal.aborted)throw {code:"cancelled"};
    if(ctl.signal.aborted)throw {code:"timeout"};
    throw {code:"network",message:String(e&&e.message||e)};
  }finally{clearTimeout(to);if(signal)signal.removeEventListener("abort",onAbort)}
}
// asks Google which models this key can use, and orders the "flash" ones newest first
let gFound=null;
async function discoverModels(key){
  if(gFound)return gFound;
  try{const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200",{headers:{"x-goog-api-key":key}});
    const d=await r.json();
    const ok=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>String(m.name).replace(/^models\//,""))
      .filter(n=>/^gemini/.test(n)&&/flash/.test(n)&&!/image|tts|audio|live|embedding|exp|vision|thinking/.test(n));
    const ver=n=>{const v=(n.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1];return v?parseFloat(v):(/latest/.test(n)?99:0)};
    const score=n=>ver(n)*10-(/lite/.test(n)?3:0)-(/preview/.test(n)?2:0);
    gFound=ok.sort((a,b)=>score(b)-score(a)).slice(0,5);

/* --- one model, chosen once: when the key is saved, the app races Google's flash models and keeps the fastest that answers --- */

async function pickModel(key){
  const found=await discoverModels(key);
  const cands=(found.length?found:GMODELS).slice(0,5);
  const tryOne=m=>gFetch(m,key,JSON.stringify({contents:[{role:"user",parts:[{text:"Reply with the single word OK."}]}],generationConfig:Object.assign({maxOutputTokens:30},thinkCfg(m,true))}),null,10000)
    .then(({res,txt})=>{if(res.ok)return m;let msg="";try{msg=(JSON.parse(txt).error||{}).message||""}catch(e){}
      if(res.status===400&&/think/i.test(msg)){NOTHINK.add(m);return gFetch(m,key,JSON.stringify({contents:[{role:"user",parts:[{text:"Reply with the single word OK."}]}],generationConfig:{maxOutputTokens:30}}),null,10000).then(r=>{if(r.res.ok)return m;throw {code:"upstream_error",message:m+": "+r.res.status}})}

      throw {code:res.status===429?"rate_limited":"upstream_error",message:m+": "+res.status+" "+msg.slice(0,80)}});

  catch(agg){const errs=(agg&&agg.errors)||[];throw errs.find(e=>e&&e.code==="bad_key")||errs.find(e=>e&&e.code==="rate_limited")||errs[0]||{code:"upstream_error"}}

const NOTHINK=new Set();let gModelFast=null;
function thinkCfg(m,fast){
  if(!fast)return {};

async function gCall(key,input,json,signal,again,fast){
  // if one model is missing or out of free quota, try the next one; "fast" (live call turns) puts the lighter models first
  let saved=[];try{saved=JSON.parse(localStorage.getItem("otl_gemini_models")||"[]")}catch(e){}
  let base=(saved.length?saved:GMODELS).slice();
  if(fast)base.sort((a,b)=>(/lite/.test(b)?1:0)-(/lite/.test(a)?1:0));
  const pick=fast?(getPin()||gModelFast):gModel;
  const models=pick?[pick].concat(base.filter(x=>x!==pick)):base;let lastErr={code:"upstream_error",message:"no model answered"};
  const tried=[],all404=()=>tried.length&&tried.every(t=>/not found/.test(t));
  const hasAudio=Array.isArray(input)&&input.some(x=>x&&x.parts&&x.parts.some(p=>p.inline_data));
  for(const m of models){
    let r,res,txt,d,msg;
    for(let attempt=0;attempt<2;attempt++){
      const gc=Object.assign({temperature:json?.4:.9},json?{responseMimeType:"application/json"}:{},thinkCfg(m,fast));
      const body=JSON.stringify({contents:toContents(input),generationConfig:gc});
      try{r=await gFetch(m,key,body,signal,fast?(hasAudio?10000:5000):60000)}
      catch(e){if(e.code==="timeout"||e.code==="network"){lastErr=e;if(e.code==="timeout"){r=null;break}throw e}throw e}
      res=r.res;txt=r.txt;d=null;try{d=JSON.parse(txt)}catch(e){}
      msg=((d&&d.error)||{}).message||"";
      if(res.status===400&&/think/i.test(msg)&&!NOTHINK.has(m)){NOTHINK.add(m);continue}
      break;
    }
    if(!r)continue;
    if(res.status===404){tried.push(m+": not found");lastErr={code:"upstream_error",message:tried.join(" | ")};continue}
    if(res.status===429){tried.push(m+": limit");lastErr={code:"rate_limited",message:tried.join(" | ")+" "+msg.slice(0,80)};continue}
    if(!res.ok){
      if(res.status===401||res.status===403||/api key/i.test(msg))throw {code:"bad_key",message:msg};
      if(/location is not supported|not available in your country/i.test(msg))throw {code:"region",message:msg};
      lastErr={code:"upstream_error",message:res.status+" "+msg};if(res.status>=500)continue;throw lastErr}
    const c=d&&d.candidates&&d.candidates[0];
    const text=c&&c.content&&c.content.parts?c.content.parts.filter(p=>!p.thought).map(p=>p.text||"").join(""):"";
    if(!text){lastErr={code:"upstream_error",message:(c&&c.finishReason)||"empty answer"};continue}
    if(fast)gModelFast=m;else gModel=m;return text;
  }
  // every model name was unknown: ask Google for this key's models and try those once
  if(!again&&(all404()||!saved.length)){
    try{localStorage.removeItem("otl_gemini_models")}catch(e){}gFound=null;gModel=null;gModelFast=null;
    const found=await discoverModels(key);
    if(found.length&&found.some(f=>!models.includes(f)||all404())){try{localStorage.setItem("otl_gemini_models",JSON.stringify(found))}catch(e){}return gCall(key,input,json,signal,true,fast)}
    if(!found.length&&all404())lastErr={code:"upstream_error",message:"المفتاح ده مش شايف أي موديل Gemini Flash. "+tried.join(" | ")};

function geminiSample(key){

/* --- browser speech recognition (Chrome), shaped like the dictation capability so mic() works the same --- */
function webDict(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  let rec=null,state="idle";const fin=new Set(),par=new Set(),st=new Set();
  const emit=(set,e)=>set.forEach(f=>{try{f(e)}catch(_){}});
  const setState=(s,reason)=>{state=s;emit(st,reason?{state:s,reason}:{state:s})};
  return {
    active:()=>state!=="idle",
    start(){if(rec){try{rec.abort()}catch(e){}rec=null;state="idle"}return new Promise((res,rej)=>{
      // one phrase per tap: Chrome ends on its own after you stop talking, and a 10-second guard ends it if it doesn't
      const r=new SR();rec=r;r.lang="en-US";r.interimResults=true;r.continuous=false;r.maxAlternatives=1;let reason="stopped",live=false;
      const guard=setTimeout(()=>{if(rec===r)try{r.stop()}catch(e){}},10000);
      r.onstart=()=>{live=true;setState("listening");res()};
      r.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal){emit(par,{text:""});emit(fin,{text:" "+x[0].transcript.trim()})}else interim+=x[0].transcript}if(interim)emit(par,{text:interim})};
      r.onerror=e=>{reason=(e.error==="not-allowed"||e.error==="service-not-allowed")?"not_granted":e.error==="no-speech"?"no_speech":e.error==="aborted"?"stopped":"upstream_error";if(!live)rej({code:reason})};
      r.onend=()=>{clearTimeout(guard);if(rec===r)rec=null;setState("idle",reason)};
      setState("starting");try{r.start()}catch(err){rec=null;setState("idle","upstream_error");rej({code:"upstream_error"})}
    })},
    stop(){if(rec&&state!=="finishing"){setState("finishing");try{rec.stop()}catch(e){}}return Promise.resolve()},
    onFinal(f){fin.add(f);return()=>fin.delete(f)},onPartial(f){par.add(f);return()=>par.delete(f)},onState(f){st.add(f);return()=>st.delete(f)}
  };
}

/* ---------------- WORDS (SRS) ---------------- */
let W={deck:"all",cat:"all",q:null,i:0,rev:false,heard:null,browse:false,use:null,useBusy:false};
function deckCards(){return Object.values(CARDS).filter(c=>(W.deck==="all"||c.deck===W.deck)&&(W.cat==="all"||c.cat===W.cat))}
function newCap(){return D().form==="words"?30:15}
function isDue(c){const s=S.srs[c.id];return s&&s.due<=today()}
function buildQ(){
  const d=D(),cs=deckCards();
  const due=shuffle(cs.filter(isDue));
  const newLeft=Math.max(0,newCap()-d.newc);
  const fresh=cs.filter(c=>!S.srs[c.id]).sort((a,b)=>prio(a)-prio(b));
  // interleave decks for new cards
  const nv=fresh.filter(c=>c.deck==="vo"),nc=fresh.filter(c=>c.deck==="ch"),mix=[];
  while((nv.length||nc.length)&&mix.length<newLeft){if(nc.length)mix.push(nc.shift());if(nv.length&&mix.length<newLeft)mix.push(nv.shift())}
  return due.concat(mix).map(c=>c.id);
}
function vWords(){
  const cs=deckCards(),due=cs.filter(isDue).length,learned=cs.filter(c=>(S.srs[c.id]||{}).b>=3).length,newLeft=Math.max(0,newCap()-D().newc);
  const decks=[["all","الكل"],["vo","Vocab"],["ch","تعبيرات"]];

  const head=`<section class="panel"><div class="row">${decks.map(([k,n])=>`<button class="chip" data-act="w-deck" data-v="${k}" aria-pressed="${W.deck===k}">${n}</button>`).join("")}</div>
    <div style="margin-top:10px">${speedChips()}</div>
    ${cats.length?`<div class="row" style="margin-top:10px"><button class="chip" data-act="w-cat" data-v="all" aria-pressed="${W.cat==="all"}">كل الأقسام</button>${cats.map(([k,n])=>`<button class="chip" data-act="w-cat" data-v="${k}" aria-pressed="${W.cat===k}">${esc(n)}</button>`).join("")}</div>`:""}
    <div class="grid3" style="margin-top:14px">
      <div><div class="label">مستنية مراجعة</div><b class="mono" style="font-size:1.5rem">${due}</b></div>

      <div><div class="label">ثبتت (اتراجعت 3 مرات)</div><b class="mono" style="font-size:1.5rem">${learned}<span class="muted small">/${cs.length}</span></b></div>
    </div></section>`;
  if(W.q&&W.i<W.q.length)return `<div class="stack">${head}${vCard()}</div>`;

      <div><h3>إزاي بتشتغل</h3><p class="muted small">هتشوف المعنى بالعربي، وإنت <b>تقولها بالإنجليزي بصوتك</b> قبل ما تشوف الإجابة. بعد كده تقيّم نفسك، والكارت اللي نسيته يرجعلك بدري، واللي حافظه يتأجل (Spaced repetition). وفي كل كارت فيه زرار <b>"استخدمها في جملة"</b>: تكتب أو تقول جملة من عندك و${AIN()} يصحّحها. الجملة اللي إنت بتألّفها بنفسك بتثبت في دماغك أكتر من أي حفظ.</p></div>
      <div class="row"><button class="btn primary" data-act="w-start" ${due+newLeft===0?"disabled":""}>ابدأ المراجعة (${Math.min(due+newLeft,due+cs.filter(c=>!S.srs[c.id]).length)})</button><button class="btn" data-act="w-browse">اعرض كل الكروت</button></div>

function vUse(c){

    ${u.res?`<div class="heard ${u.res.ok?"good":"bad"}">${u.res.ok?"جملة سليمة.":"فيها حاجة:"} ${u.res.fixed&&!u.res.ok?`<div class="en better" style="margin-top:4px">${esc(u.res.fixed)}</div>`:""}<div style="margin-top:4px;color:var(--ink)">${esc(u.res.why_ar||"")}</div>${u.res.natural?`<div class="small" style="margin-top:4px;color:var(--muted)">أطبع: <span class="en">${esc(u.res.natural)}</span></div>`:""}</div>`:""}

function rate(r){
  const id=W.q[W.i],k=today(),d=D(k);let s=S.srs[id];
  if(!s){s={b:0,due:k};d.newc++}
  if(r===0){s.b=1;s.due=k;if(W.q.filter(x=>x===id).length<3)W.q.push(id)}
  else if(r===1){s.b=Math.max(1,s.b);s.due=addDays(k,1)}
  else{s.b=Math.min(5,s.b+1);s.due=addDays(k,INT[s.b])}
  S.srs[id]=s;d.words++;save();
  W.i++;W.rev=false;W.heard=null;W.use=null;render();

function judgeSound(target,heard){
  const tw=words(target);
  if(tw.length===1)return words(heard).includes(tw[0]);

}

let G={mode:"rules",q:null,i:0,val:"",res:null,src:"base",gen:null,genBusy:false,fix:"",fixRes:null,fixBusy:false};
function gOrder(){const w=lvl();let ix=GRAM.map((_,i)=>i).filter(i=>{const l=gLv(i),g=S.gram[i];return l<=w+1&&(l>=w-1||(g&&g.bad>0))});
  if(ix.length<10)ix=GRAM.map((_,i)=>i).filter(i=>gLv(i)<=w+1);return shuffle(ix).sort((a,b)=>{const A=S.gram[a]||{ok:0,bad:0},B=S.gram[b]||{ok:0,bad:0};return (A.ok-A.bad*2)-(B.ok-B.bad*2)})}
function curG(){if(G.src==="gen")return G.gen[G.i];const g=GRAM[G.q[G.i]];return {wrong:g[0],ok:g[1],tip:g[2]}}
function vGrammar(){
  if(G.mode==="rules")return vRules();
  if(!G.q)G.q=gOrder();
  const list=G.src==="gen"?G.gen:G.q;
  const mastered=GRAM.filter((_,i)=>(S.gram[i]||{}).ok>=2&&!(S.gram[i]||{}).bad).length;
  const g=list&&G.i<list.length?curG():null;
  const drill=g?`<section class="card">

  if(c.msgs.filter(m=>m.role==="user").length<2){toast("اتكلم شوية الأول، محتاج على الأقل ردّين منك.");return}
  if(c.ctl)c.ctl.abort();
  c.ended=true;c.fbBusy=true;renderFb();
  const sc=c.sc,meL=sc.gen?"LEARNER":sc.interview?"CANDIDATE":"AGENT",themL=sc.gen?"PARTNER":sc.interview?"INTERVIEWER":"CUSTOMER";
  const tr=c.msgs.map(m=>(m.role==="user"?meL:themL)+": "+m.content).join("\n");
  try{
    const P=(`You are an English coach for ${sc.gen?"Egyptian English learners":"Egyptian call-center job applicants"} (target: B2, Versant-style hiring standard). The learner's placement-test level is ${LV[lvl()]}; judge fairly for that level but score readiness for the job. Below is a practice ${sc.gen?"everyday English conversation":sc.interview?"job interview":"customer service call"} transcript. Evaluate ONLY the ${meL} lines (the learner). The lines may come from speech-to-text, so ignore capitalization and punctuation.
Reply with only JSON of this shape:
{"score": integer 1-10 (${sc.gen?"overall speaking quality for this level":"readiness for the job"}), "level": "A2"|"B1"|"B1+"|"B2"|"B2+"|"C1", "summary_ar": "2-3 sentences in Egyptian Arabic: what was good and the single most important thing to fix", "mistakes": [{"said": "the learner's exact words (short excerpt)", "better": "corrected natural version", "why_ar": "short reason in Egyptian Arabic"}], "phrases": [{"instead": "what the learner said", "use": "a more professional phrase"}], "skill_ar": "one practical tip in Egyptian Arabic about ${sc.gen?"keeping a conversation going naturally":sc.interview?"interview technique":"call handling (empathy, control, verification, closing)"}"}
At most 8 mistakes, the most important first; skip trivial ones; empty list if none. At most 4 phrases.

TRANSCRIPT:
${tr.slice(0,20000)}`);
    const aud=c.msgs.filter(m=>m.audio!=null&&c.audio&&c.audio[m.audio]);
    if(aud.length){const w=aud.reduce((x,m)=>x+words(m.content).length,0),sec=aud.reduce((x,m)=>x+c.audio[m.audio].dur,0);c.wpm=sec>3?Math.round(w/sec*60):null}
    const r=await sample.json(await fbInput(c,P,meL),{});
    c.fb=r;
    const k=today();
    S.calls.push({d:k,s:sc.id,score:Number(r.score)||0,level:String(r.level||"")});
    if(S.calls.length>200)S.calls=S.calls.slice(-200);
    (Array.isArray(r.mistakes)?r.mistakes:[]).forEach(m=>{if(!m||!m.said||!m.better)return;if(S.mistakes.some(x=>norm(x.said)===norm(m.said)))return;S.mistakes.push({said:String(m.said),better:String(m.better),why:String(m.why_ar||""),d:k})});
    if(S.mistakes.length>80)S.mistakes=S.mistakes.slice(-80);
    D(k).calls++;save();
  }catch(e){const m=aiErr(e);if(m)toast(m)}
  c.fbBusy=false;renderFb();
}
function renderFb(){
  const c=call,el=$("#fb");if(!el)return;
  const ci=$("#callIn");if(ci)ci.hidden=c.ended;
  if(c.fbBusy){el.innerHTML=`<section class="panel"><span class="spin"></span> بحلّل المكالمة... (ممكن ياخد دقيقة)</section>`;return}
  const r=c.fb;if(!r){el.innerHTML="";return}
  const mis=Array.isArray(r.mistakes)?r.mistakes:[],ph=Array.isArray(r.phrases)?r.phrases:[];
  el.innerHTML=`<section class="panel stack">
    <div class="row" style="gap:18px"><div class="score">${esc(r.score)}<span class="muted" style="font-size:1rem">/10</span></div><div><span class="pill live">المستوى: ${esc(r.level)}</span><p style="margin-top:6px">${esc(r.summary_ar)}</p></div></div>
    ${speakingHtml(c,r)}
    ${mis.length?`<div><h3>الأغلاط (اتسجلت في سجلّك)</h3>${mis.map(m=>`<div class="mis"><div class="en said">${esc(m.said)}</div><div class="row" style="gap:6px"><span class="en better">${esc(m.better)}</span>${spk(m.better)}</div><div class="small muted">${esc(m.why_ar)}</div></div>`).join("")}</div>`:`<div class="note">مفيش أغلاط مهمة. ممتاز.</div>`}
    ${ph.length?`<div><h3>قولها بطريقة أحترف</h3>${ph.map(p=>`<div class="mis"><div class="en muted">${esc(p.instead)}</div><div class="row" style="gap:6px"><span class="en better">${esc(p.use)}</span>${spk(p.use)}</div></div>`).join("")}</div>`:""}
    ${r.skill_ar?`<div class="mouth"><b>نصيحة:</b> ${esc(r.skill_ar)}</div>`:""}
    <div class="row"><button class="btn primary" data-act="call-again">نفس المكالمة تاني</button><button class="btn" data-act="call-quit">مكالمة تانية</button><button class="btn" data-act="g-gen-go">تمرّن على أغلاطك</button></div>
  </section>`;
}

/* ---------------- PROGRESS ---------------- */
let confirmReset=false;
function vProgress(){
  const keys=Object.keys(S.days).filter(active).sort();
  let streak=0,k=today();if(!active(k))k=addDays(k,-1);while(active(k)){streak++;k=addDays(k,-1)}
  const ids=Object.keys(CARDS),learned=ids.filter(i=>(S.srs[i]||{}).b>=3).length,seen=ids.filter(i=>S.srs[i]).length;
  let ok=0,bad=0;Object.values(S.gram).forEach(g=>{ok+=g.ok;bad+=g.bad});
  const acc=ok+bad?Math.round(ok/(ok+bad)*100):0;
  const sc=S.calls.filter(c=>c.score);const avg=sc.length?(sc.reduce((a,c)=>a+c.score,0)/sc.length).toFixed(1):"—";
  const last=sc.slice(-12);
  const W_=Math.max(1,last.length);
  const chart=last.length>1?`<svg viewBox="0 0 320 120" style="width:100%;max-width:100%;height:auto" role="img" aria-label="درجات المكالمات">
     ${[0,5,10].map(v=>`<line x1="24" x2="316" y1="${100-v*9}" y2="${100-v*9}" stroke="var(--line)" stroke-width="1"/><text x="2" y="${104-v*9}" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono">${v}</text>`).join("")}
     <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${last.map((c,i)=>(24+i*(292/(W_-1)))+","+(100-c.score*9)).join(" ")}"/>
     ${last.map((c,i)=>`<circle cx="${24+i*(292/(W_-1))}" cy="${100-c.score*9}" r="${i===last.length-1?4.5:3}" fill="${i===last.length-1?"var(--live)":"var(--accent)"}"/>`).join("")}
   </svg>`:`<p class="small muted">اعمل مكالمتين على الأقل عشان يظهر الرسم.</p>`;
  return `<div class="stack">
   <div class="grid3">
     <div class="kpi"><div class="label">أيام اتمرّنت فيها</div><b>${keys.length}</b></div>
     <div class="kpi"><div class="label">أيام ورا بعض</div><b>${streak}</b></div>
     <div class="kpi"><div class="label">كلمات وتعبيرات ثبتت</div><b>${learned}<span class="small muted">/${ids.length}</span></b><span class="small muted">اتعرض عليك ${seen}</span></div>
     <div class="kpi"><div class="label">دقة الجرامر</div><b>${acc}%</b><span class="small muted">${ok+bad} جملة</span></div>
     <div class="kpi"><div class="label">مكالمات وإنترفيوهات</div><b>${S.calls.length}</b></div>
     <div class="kpi"><div class="label">متوسط الدرجة</div><b>${avg}</b><span class="small muted">من 10</span></div>
   </div>
   ${S.tests.length?`<section class="panel stack" style="gap:14px"><div class="row between"><h3>مستواك</h3><button class="btn" data-act="test-go">اعمل الاختبار تاني</button></div>${ladder(lvl(),project(lvl()).real,"هدف "+arDate(endDay()))}<div class="small muted">${S.tests.map(t=>`<span class="mono">${arDate(t.d)}: ${LV[t.idx]}</span>`).join(" · ")}</div></section>`:`<section class="panel row between"><div><h3>لسه ما عملتش اختبار المستوى</h3><p class="small muted">10 دقايق بيظبطوا الخطة على مستواك.</p></div><button class="btn primary" data-act="test-go">ابدأ الاختبار</button></section>`}
   <section class="panel"><h3 style="margin-bottom:8px">درجة آخر المكالمات</h3>${chart}<p class="small muted">الهدف: 8 أو أكتر بشكل ثابت قبل 5 يناير.</p></section>
   ${STANDALONE?(sample?`<section class="panel row between"><div><h3>Gemini شغال</h3><p class="small muted">المفتاح محفوظ في المتصفح ده بس.${getPin()?' الموديل السريع: <span class="en mono">'+esc(getPin())+'</span>':""}</p></div><button class="btn danger" data-act="key-del">امسح المفتاح</button></section>`:vSetup()):""}
   <section class="panel stack" style="gap:10px"><h3>بتتعلم عشان إيه؟</h3><p class="small muted">بيغيّر الكلمات اللي بتظهرلك الأول، والخطة، والمحادثات المقترحة.</p><div class="row" style="gap:6px">${goalChips()}</div></section>
   <section class="panel"><h3>بداية جديدة</h3><p class="small muted" style="margin:4px 0 10px">بيمسح كل التقدم وسجل الأغلاط.</p>
     ${confirmReset?`<div class="row"><span>متأكد؟ مش هينفع ترجعه.</span><button class="btn danger" data-act="reset-yes">أيوه امسح</button><button class="btn" data-act="reset-no">لأ</button></div>`:`<button class="btn danger" data-act="reset-ask">امسح التقدم</button>`}</section>
  </div>`;
}

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const f=H[el.dataset.act];if(f){e.preventDefault&&el.tagName!=="A"&&e.preventDefault();f(el,e)}});
document.addEventListener("keydown",e=>{
  if(e.target.id==="callBox"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendCall()}
  if(e.target.id==="gIn"&&e.key==="Enter"){e.preventDefault();gCheck()}
